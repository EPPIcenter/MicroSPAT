# Checks for pull requests and pushes to master: Rust format, clippy, tests,
# and cargo-deny (licenses/advisories), UI format, typecheck, type-aware lint,
# unit tests, build, Playwright E2E, and cross-platform compilation of the
# desktop app and standalone server on Linux, Windows, and macOS.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test, deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential file mold

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.94.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          RUSTFLAGS: -C link-arg=-fuse-ld=mold
      - run: cargo test --workspace
        env:
          RUSTFLAGS: -C link-arg=-fuse-ld=mold

      - name: Check Rust advisories, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3

  ui:
    name: UI (fmt, typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm fmt:check
        working-directory: ui
      - run: pnpm typecheck
        working-directory: ui
      - run: pnpm lint
        working-directory: ui
      - run: pnpm test
        working-directory: ui
      - run: pnpm build
        working-directory: ui

  ui-e2e:
    name: UI E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ui
      - run: pnpm e2e
        working-directory: ui

  cross-platform:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: Windows x64
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      # Skip LTO and full optimization on PR verification builds; release.yml keeps opt-level = 3 and lto = "thin".
      CARGO_PROFILE_RELEASE_LTO: 'off'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential file mold
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.94.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ci-build-${{ runner.os }}
          cache-on-failure: true

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm install --frozen-lockfile
        working-directory: ui

      - name: Build desktop binary (no bundle)
        run: pnpm tauri build --no-bundle

      - name: Build standalone server (embedded UI)
        run: cargo build --release -p microspat-server --features embed-ui

      - name: Run desktop shell unit tests
        run: cargo test -p microspat-desktop --release
